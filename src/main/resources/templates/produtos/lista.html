<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="content">
<h2>Produtos</h2>
<div id="mensagem" class="alert alert-danger" role="alert" tabindex="-1" hidden></div>
<form id="produto-form" class="card card-body mb-4" th:if="${perfilAtual == 'ADMIN' or perfilAtual == 'GERENTE'}">
    <h3 class="h5">Cadastrar ou editar produto</h3>
    <input type="hidden" id="produto-id">
    <div class="row g-3">
        <div class="col-md-5"><label for="nome" class="form-label">Nome</label><input id="nome" class="form-control" required></div>
        <div class="col-md-3"><label for="tipo" class="form-label">Tipo</label><select id="tipo" class="form-select"><option>Pizza</option><option>Bebida</option><option>Lanche</option><option>Porcao</option><option>Adicional</option></select></div>
        <div class="col-md-2"><label for="preco" class="form-label">Preco (R$)</label><input id="preco" class="form-control" type="number" min="0" step="0.01" required></div>
        <div class="col-md-2"><label><input id="ativo" type="checkbox" checked> Ativo</label></div>
    </div>
    <div class="mt-3"><button type="submit" class="btn btn-primary">Salvar</button> <button type="reset" class="btn btn-outline-secondary" id="limpar">Limpar</button></div>
</form>
<div class="table-responsive"><table class="table"><thead><tr><th>Nome</th><th>Tipo</th><th>Preco</th><th>Ativo</th><th>Acoes</th></tr></thead><tbody id="produtos"></tbody></table></div>
<script th:inline="javascript">
(async function() {
    const editar = /*[[${perfilAtual == 'ADMIN' or perfilAtual == 'GERENTE'}]]*/ false;
    const form = document.getElementById('produto-form');
    async function carregar() {
        const produtos = await api('/api/produtos'); const tabela = document.getElementById('produtos'); tabela.replaceChildren();
        produtos.forEach(p => {
            const row = document.createElement('tr'); tabela.appendChild(row);
            [p.nome, p.tipo, Number(p.preco).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}), p.ativo ? 'Sim' : 'Nao'].forEach(value => {
                const td = document.createElement('td'); td.textContent = value; row.appendChild(td);
            });
            const acoes = document.createElement('td'); row.appendChild(acoes);
            if (editar) {
                const btn = document.createElement('button'); btn.className = 'btn btn-sm btn-outline-primary me-2'; btn.textContent = 'Editar'; acoes.appendChild(btn);
                btn.onclick = () => { document.getElementById('produto-id').value = p.id; ['nome','tipo','preco'].forEach(k => document.getElementById(k).value = p[k]); document.getElementById('ativo').checked = p.ativo; form.scrollIntoView(); };
                const excluir = document.createElement('button'); excluir.className = 'btn btn-sm btn-outline-danger'; excluir.textContent = 'Excluir'; acoes.appendChild(excluir);
                excluir.onclick = async () => { if (!confirm('Excluir produto? Os itens de pedidos existentes serao preservados.')) return; try { await api('/api/produtos/' + p.id, 'DELETE'); await carregar(); } catch(e) { mostrarErro(e); } };
            }
        });
    }
    if (form) {
        document.getElementById('limpar').onclick = () => document.getElementById('produto-id').value = '';
        form.onsubmit = async e => {
            e.preventDefault(); const btn = form.querySelector('[type="submit"]'); btn.disabled = true;
            try {
                const id = document.getElementById('produto-id').value;
                const produto = {nome: document.getElementById('nome').value, tipo: document.getElementById('tipo').value, preco: Number(document.getElementById('preco').value), ativo: document.getElementById('ativo').checked};
                await api('/api/produtos' + (id ? '/' + id : ''), id ? 'PUT' : 'POST', produto);
                form.reset(); document.getElementById('produto-id').value = ''; document.getElementById('mensagem').hidden = true; await carregar();
            } catch(e) { mostrarErro(e); } finally { btn.disabled = false; }
        };
    }
    try { await carregar(); } catch(e) { mostrarErro(e); }
})();
</script>
</div>
</body></html>
