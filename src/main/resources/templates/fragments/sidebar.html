<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar">
    <div id="sidebar">
        <h4 class="text-center py-3">Pediu Patrao</h4>
        <p class="text-center small" th:text="${perfilAtual}"></p>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item" th:if="${perfilAtual != 'ADMIN'}"><a class="nav-link" href="/clientes">Clientes</a></li>
            <li class="nav-item"><a class="nav-link" href="/pedidos">Pedidos</a></li>
            <li class="nav-item"><a class="nav-link" href="/produtos">Produtos</a></li>
            <li class="nav-item" th:if="${perfilAtual == 'ADMIN'}"><a class="nav-link" href="/usuarios">Usuarios</a></li>
            <li class="nav-item" th:if="${perfilAtual == 'ADMIN' or perfilAtual == 'GERENTE'}"><a class="nav-link" href="/auditoria">Auditoria</a></li>
        </ul>
        <form th:action="@{/logout}" method="post" class="m-3">
            <button class="btn btn-outline-light btn-sm" type="submit">Sair</button>
        </form>
    </div>
</div>
</body>
</html>
